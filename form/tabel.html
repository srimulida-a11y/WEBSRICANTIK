<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tabel Saldo</title>
</head>
<body>

    <table border="1">
        <tr>
            <th rowspan="2">No</th>
            <th rowspan="2">Hari</th>
            <th rowspan="2">Tanggal</th>
            <th colspan="2">Saldo</th>
            <th rowspan="2">Keterangan</th>
        </tr>

        <tr>
            <th>Masuk</th>
            <th>Keluar</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Senin</td>
            <td>1</td>
            <td>1.000.000</td>
            <td>250.000</td>
            <td>-</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Selasa</td>
            <td>2</td>
            <td>750.000</td>
            <td>500.000</td>
            <td>-</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Rabu</td>
            <td>3</td>
            <td>500.000</td>
            <td>1.000.000</td>
            <td>-</td>
        </tr>

        <tr>
            <td>4</td>
            <td>Kamis</td>
            <td>4</td>
            <td>1.000.000</td>
            <td>500.000</td>
            <td>-</td>
        </tr>

        <tr>
            <th colspan="3">Total</th>
            <td>3.250.000</td>
            <td>2.250.000</td>
            <td>-</td>
        </tr>
    </table>

</body>
</html>

</body>
